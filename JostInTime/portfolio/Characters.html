<!-- Lightbox modal -->
<div class="lightbox" id="lightbox" aria-hidden="true">
  <div class="lightbox-backdrop" data-close="true"></div>

  <div class="lightbox-panel" role="dialog" aria-modal="true" aria-label="Media viewer">

    <div class="lightbox-content" id="lightboxContent"></div>
  </div>

<!-- Carousel + Lightbox JS -->
<script>
  (function () {
    // ===== Carousel =====
    const track = document.getElementById("charTrack");
    const dotsWrap = document.getElementById("charDots");
    const prevBtn = document.querySelector(".carousel-btn.prev");
    const nextBtn = document.querySelector(".carousel-btn.next");

    if (!track || !dotsWrap) return;

    const slides = Array.from(track.querySelectorAll(".slide"));
    let activeIndex = 0;

    const dots = slides.map((_, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "carousel-dot";
      b.setAttribute("aria-label", `Go to slide ${i + 1}`);
      b.addEventListener("click", () => scrollToIndex(i));
      dotsWrap.appendChild(b);
      return b;
    });

    function setActive(i) {
      activeIndex = Math.max(0, Math.min(i, slides.length - 1));
      dots.forEach((d, idx) => d.classList.toggle("is-active", idx === activeIndex));
    }

    function scrollToIndex(i) {
      const slide = slides[i];
      if (!slide) return;
      track.scrollTo({ left: slide.offsetLeft, behavior: "smooth" });
      setActive(i);
    }

    function getClosestIndex() {
      const x = track.scrollLeft;
      let closest = 0;
      let min = Infinity;
      slides.forEach((s, i) => {
        const dist = Math.abs(s.offsetLeft - x);
        if (dist < min) { min = dist; closest = i; }
      });
      return closest;
    }

    prevBtn?.addEventListener("click", () => scrollToIndex(activeIndex - 1));
    nextBtn?.addEventListener("click", () => scrollToIndex(activeIndex + 1));

    let ticking = false;
    track.addEventListener("scroll", () => {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => {
        setActive(getClosestIndex());
        ticking = false;
      });
    }, { passive: true });
    

    setActive(0);

    // ===== Lightbox (click to enlarge) =====
    const lightbox = document.getElementById("lightbox");
    const content = document.getElementById("lightboxContent");
    if (!lightbox || !content) return;

    function openLightbox({ type, src, alt }) {
      content.innerHTML = "";

      if (type === "video") {
        const video = document.createElement("video");
        video.src = src;
        video.controls = true;
        video.autoplay = true;
        video.playsInline = true;
        content.appendChild(video);
      } else {
        const img = document.createElement("img");
        img.src = src;
        img.alt = alt || "Enlarged image";
        content.appendChild(img);
      }

      lightbox.classList.add("is-open");
      lightbox.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
    }

    function closeLightbox() {
      lightbox.classList.remove("is-open");
      lightbox.setAttribute("aria-hidden", "true");
      content.innerHTML = "";
      document.body.style.overflow = "";
    }

    document.addEventListener("click", (e) => {
      const btn = e.target.closest(".media-btn");
      if (btn) {
        openLightbox({
          type: btn.dataset.type || "image",
          src: btn.dataset.src,
          alt: btn.dataset.alt || btn.querySelector("img")?.alt || ""
        });
        return;
      }

      if (e.target.closest('[data-close="true"]')) {
        closeLightbox();
      }
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && lightbox.classList.contains("is-open")) {
        closeLightbox();
      }
    });
  })();
</script>
