  <!-- Carousel + Lightbox JS -->
  <script>
    (function () {
      // ===== Carousel =====
      const track = document.getElementById("charTrack");
      const dotsWrap = document.getElementById("charDots");
      const prevBtn = document.querySelector(".carousel-btn.prev");
      const nextBtn = document.querySelector(".carousel-btn.next");

      if (!track || !dotsWrap) return;

      const slides = Array.from(track.querySelectorAll(".slide"));
      let activeIndex = 0;

      const dots = slides.map((_, i) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "carousel-dot";
        b.setAttribute("aria-label", `Go to slide ${i + 1}`);
        b.addEventListener("click", () => scrollToIndex(i));
        dotsWrap.appendChild(b);
        return b;
      });

      function setActive(i) {
        activeIndex = Math.max(0, Math.min(i, slides.length - 1));
        dots.forEach((d, idx) => d.classList.toggle("is-active", idx === activeIndex));
      }

      function scrollToIndex(i) {
        const slide = slides[i];
        if (!slide) return;
        track.scrollTo({ left: slide.offsetLeft, behavior: "smooth" });
        setActive(i);
      }

      function getClosestIndex() {
        const x = track.scrollLeft;
        let closest = 0;
        let min = Infinity;
        slides.forEach((s, i) => {
          const dist = Math.abs(s.offsetLeft - x);
          if (dist < min) { min = dist; closest = i; }
        });
        return closest;
      }

      prevBtn?.addEventListener("click", () => scrollToIndex(activeIndex - 1));
      nextBtn?.addEventListener("click", () => scrollToIndex(activeIndex + 1));

      let ticking = false;
      track.addEventListener("scroll", () => {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(() => {
          setActive(getClosestIndex());
          ticking = false;
        });
      }, { passive: true });

      setActive(0);

      // ===== Lightbox =====
      const lightbox = document.getElementById("lightbox");
      const content = document.getElementById("lightboxContent");
      if (!lightbox || !content) return;

      function openLightbox({ type, src, alt }) {
        content.innerHTML = "";

        if (type === "youtube") {
  const vid = src || "";

  const wrapper = document.createElement("div");
  wrapper.className = "yt-lightbox";

  // Clickable "player"
  const player = document.createElement("a");
  player.className = "yt-player";
  player.href = `https://www.youtube.com/watch?v=${vid}`;
  player.target = "_blank";
  player.rel = "noopener";
  player.setAttribute("aria-label", "Play on YouTube");

  // Thumbnail
  const thumb = document.createElement("img");
  thumb.className = "yt-thumb";
  thumb.src = `https://i.ytimg.com/vi/${vid}/maxresdefault.jpg`;
  thumb.alt = alt || "YouTube video thumbnail";
  thumb.onerror = () => {
    thumb.src = `https://i.ytimg.com/vi/${vid}/hqdefault.jpg`;
  };

  // Play overlay
  const overlay = document.createElement("div");
  overlay.className = "yt-overlay";
  overlay.innerHTML = `
    <div class="yt-playbtn" aria-hidden="true">
      <span class="yt-tri"></span>
    </div>
    <div class="yt-hint">Play on YouTube</div>
  `;

  player.appendChild(thumb);
  player.appendChild(overlay);

  // Optional secondary button (nice for accessibility + clarity)
  const link = document.createElement("a");
  link.className = "yt-openlink";
  link.href = `https://www.youtube.com/watch?v=${vid}`;
  link.target = "_blank";
  link.rel = "noopener";
  link.textContent = "Open on YouTube";

  wrapper.appendChild(player);
  wrapper.appendChild(link);
  content.appendChild(wrapper);
} else if (type === "video") {
          const video = document.createElement("video");
          video.src = src;
          video.controls = true;
          video.autoplay = true;
          video.playsInline = true;
          video.style.width = "100%";
          video.style.maxHeight = "80vh";
          content.appendChild(video);

        } else {
          const img = document.createElement("img");
          img.src = src;
          img.alt = alt || "Enlarged image";
          img.style.width = "100%";
          content.appendChild(img);
        }

        lightbox.classList.add("is-open");
        lightbox.setAttribute("aria-hidden", "false");
        document.body.style.overflow = "hidden";
      }

      function closeLightbox() {
        lightbox.classList.remove("is-open");
        lightbox.setAttribute("aria-hidden", "true");
        content.innerHTML = "";
        document.body.style.overflow = "";
      }

      document.addEventListener("click", (e) => {
        const btn = e.target.closest(".media-btn");

        if (btn) {
          const type = btn.dataset.type || "image";
          const src = (type === "youtube") ? btn.dataset.id : btn.dataset.src;

          // Debug (won't crash)
          console.log("LIGHTBOX TYPE:", type);
          console.log("LIGHTBOX SRC (raw):", src);
          if (src) {
            console.log("LIGHTBOX SRC (resolved):", new URL(src, document.baseURI).href);
          }

          openLightbox({
            type,
            src,
            alt: btn.dataset.alt || btn.querySelector("img")?.alt || ""
          });
          return;
        }

        if (e.target.closest('[data-close="true"]')) {
          closeLightbox();
        }
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && lightbox.classList.contains("is-open")) {
          closeLightbox();
        }
      });
    })();
  </script>
